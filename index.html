<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saathi — Login / Register</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="center-screen">
    <div class="auth-card">
      <h1>Saathi</h1>
      <p class="sub">Apni asli photo lagayein, username banayein aur logon se connect karein.</p>

      <div class="tab-switch">
        <button id="tabLogin" class="active">Login</button>
        <button id="tabRegister">Naya Account</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm">
        <div class="field">
          <label>Username</label>
          <input type="text" id="loginUsername" placeholder="apna_username" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <div class="error-msg" id="loginError"></div>
        <button class="btn btn-primary" type="submit">Login karein</button>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" style="display:none;">
        <div class="photo-picker">
          <img id="regPreview" class="photo-preview" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23c9a6b3'%3E%3Ccircle cx='12' cy='8' r='4'/%3E%3Cpath d='M4 20c0-4 3.6-7 8-7s8 3 8 7'/%3E%3C/svg%3E" alt="preview">
          <label class="file-btn" for="regPhoto">Profile photo चुनें</label>
          <input type="file" id="regPhoto" accept="image/*">
        </div>
        <div class="field">
          <label>Username (sirf yehi naam se log aapko dhoond payenge)</label>
          <input type="text" id="regUsername" placeholder="jaise: ananya_26" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="kam se kam 6 characters" required minlength="6">
        </div>
        <div class="field">
          <label>Bio (optional)</label>
          <textarea id="regBio" rows="2" placeholder="apne baare me 1-2 line likhein"></textarea>
        </div>
        <div class="error-msg" id="registerError"></div>
        <button class="btn btn-primary" type="submit">Account banayein</button>
      </form>
    </div>
  </div>

<script>
  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');

  tabLogin.onclick = () => {
    tabLogin.classList.add('active'); tabRegister.classList.remove('active');
    loginForm.style.display='block'; registerForm.style.display='none';
  };
  tabRegister.onclick = () => {
    tabRegister.classList.add('active'); tabLogin.classList.remove('active');
    registerForm.style.display='block'; loginForm.style.display='none';
  };

  document.getElementById('regPhoto').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    document.getElementById('regPreview').src = URL.createObjectURL(file);
  });

  loginForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    const res = await fetch('/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        username: document.getElementById('loginUsername').value,
        password: document.getElementById('loginPassword').value
      })
    });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error || 'Kuch galat ho gaya'; return; }
    window.location.href = '/app.html';
  });

  registerForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errEl = document.getElementById('registerError');
    errEl.textContent = '';
    const fd = new FormData();
    fd.append('username', document.getElementById('regUsername').value);
    fd.append('password', document.getElementById('regPassword').value);
    fd.append('bio', document.getElementById('regBio').value);
    const photoFile = document.getElementById('regPhoto').files[0];
    if(photoFile) fd.append('photo', photoFile);

    const res = await fetch('/api/register', { method:'POST', body: fd });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error || 'Registration fail hua'; return; }
    window.location.href = '/app.html';
  });
</script>
</body>
</html>
